[package]
name = "claudia-cli"
version = "0.2.1"
edition = "2021"

[[bin]]
name = "claudia"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
serde_json = "1"
anyhow = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
